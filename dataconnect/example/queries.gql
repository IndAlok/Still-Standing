# Create a new crew (authenticated users only)
mutation CreateNewCrew($name: String!, $description: String, $isPublic: Boolean = true) @auth(level: USER) {
  crew_insert(data: { 
    name: $name, 
    description: $description,
    isPublic: $isPublic,
    createdById_expr: "auth.uid",
    createdAt_expr: "request.time"
  })
}

# Get public crews (available to all)
query GetPublicCrews @auth(level: PUBLIC) {
  crews(where: { isPublic: { eq: true } }) {
    id
    name
    description
    avatarUrl
    createdAt
    maxMembers
    createdBy {
      displayName
      username
    }
  }
}

# Get all crews
query GetAllCrews @auth(level: USER) {
  crews {
    id
    name
    description
    avatarUrl
    isPublic
    maxMembers
    createdAt
    createdBy {
      displayName
      username
      profilePictureUrl
    }
  }
}

# Join a crew (authenticated users only)
mutation JoinCrew($crewId: UUID!) @auth(level: USER) {
  membership_insert(data: { 
    crewId: $crewId, 
    userId_expr: "auth.uid", 
    role: "member", 
    joinedAt_expr: "request.time" 
  })
}

# Get messages for a specific crew (authenticated users only)
query GetCrewMessages($crewId: UUID!, $limit: Int = 50) @auth(level: USER) {
  messages(
    where: { 
      crewId: { eq: $crewId },
      isDeleted: { eq: false }
    }, 
    orderBy: [{ sentAt: DESC }], 
    limit: $limit
  ) {
    id
    sender {
      id
      displayName
      profilePictureUrl
      username
    }
    content
    messageType
    sentAt
    imageUrl
    videoUrl
    reactions
    mentions
  }
}

# Send a message to a crew (authenticated users only)
mutation SendMessage($crewId: UUID!, $content: String!, $messageType: String = "text") @auth(level: USER) {
  message_insert(data: {
    crewId: $crewId,
    senderId_expr: "auth.uid",
    content: $content,
    messageType: $messageType,
    sentAt_expr: "request.time"
  })
}

# Get user profile by Firebase UID (authenticated users only)
query GetUserProfile($firebaseUID: String!) @auth(level: USER) {
  users(where: { firebaseUID: { eq: $firebaseUID } }) {
    id
    username
    email
    displayName
    profilePictureUrl
    bio
    lastActiveAt
    createdAt
    isOnline
  }
}

# Create user profile (for first-time login)
mutation CreateUserProfile($firebaseUID: String!, $username: String!, $email: String!, $displayName: String, $profilePictureUrl: String) @auth(level: USER) {
  user_insert(data: {
    firebaseUID: $firebaseUID,
    username: $username,
    email: $email,
    displayName: $displayName,
    profilePictureUrl: $profilePictureUrl,
    createdAt_expr: "request.time",
    lastActiveAt_expr: "request.time"
  })
}

# Get crew members (authenticated users only)
query GetCrewMembers($crewId: UUID!) @auth(level: USER) {
  memberships(where: { crewId: { eq: $crewId }, isActive: { eq: true } }) {
    user {
      id
      displayName
      profilePictureUrl
      username
      isOnline
      lastActiveAt
    }
    role
    joinedAt
    canInvite
    canModerate
  }
}

# Get user's crew memberships
query GetUserMemberships($userId: UUID!) @auth(level: USER) {
  memberships(where: { userId: { eq: $userId }, isActive: { eq: true } }) {
    crew {
      id
      name
      description
      avatarUrl
      isPublic
    }
    role
    joinedAt
  }
}