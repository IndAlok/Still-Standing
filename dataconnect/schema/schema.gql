# User table for storing user profiles
# Firebase Auth handles authentication, this stores extended profile data
type User @table {
  id: UUID! @default(expr: "uuidV4()")
  firebaseUID: String! @unique  # Links to Firebase Auth UID
  username: String! @unique
  email: String! @unique
  displayName: String
  profilePictureUrl: String
  bio: String
  createdAt: Timestamp! @default(expr: "request.time")
  lastActiveAt: Timestamp @default(expr: "request.time")
  isOnline: Boolean @default(value: false)
}

# Crew/Group table for chat groups
type Crew @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  description: String
  avatarUrl: String
  isPublic: Boolean! @default(value: true)
  maxMembers: Int @default(value: 100)
  createdBy: User!  # Reference to user who created the crew
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp @default(expr: "request.time")
}

# Membership table for user-crew relationships
type Membership @table(key: ["user", "crew"]) {
  user: User!
  crew: Crew!
  role: String! @default(value: "member")  # admin, moderator, member
  joinedAt: Timestamp! @default(expr: "request.time")
  isActive: Boolean! @default(value: true)
  # Permissions
  canInvite: Boolean @default(value: false)
  canModerate: Boolean @default(value: false)
}

# Message table for chat messages
type Message @table {
  id: UUID! @default(expr: "uuidV4()")
  crew: Crew!
  sender: User!
  content: String!
  messageType: String! @default(value: "text")  # text, image, video, file, system
  sentAt: Timestamp! @default(expr: "request.time")
  editedAt: Timestamp
  isDeleted: Boolean @default(value: false)
  # Optional media fields
  imageUrl: String
  videoUrl: String
  fileUrl: String
  fileName: String
  fileSize: Int
  thumbnailUrl: String
  # Message metadata
  replyToMessageId: UUID  # For message threads/replies
  mentions: [String]  # Array of mentioned usernames
  reactions: [String] @default(value: [])  # Array of reaction emojis
}